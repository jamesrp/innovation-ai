[project]
name = "innovation-ai"
version = "0.1.1"
description = "A deterministic Innovation game engine and later ML research environment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ai = [
    "numpy>=2.0",
    "torch>=2.0",
]

[project.scripts]
innovation-ai = "innovation_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
# The frozen shared card/effect test-support package lives beside the suites that use it, so it
# is importable as `support` from every test module regardless of directory depth.
pythonpath = ["tests/innovation"]
markers = [
    "slow: deterministic tests excluded from the default fast suite",
    "fuzz: high-volume randomized invariant tests",
]

[tool.coverage.run]
branch = true
source = ["innovation_ai"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["innovation_ai"]
